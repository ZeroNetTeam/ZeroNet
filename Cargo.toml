[workspace]
resolver = "2"
members = ["crates/zeronet-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/ZeroNetTeam/ZeroNet-Desktop"

# The engine. Pinned by Cargo.lock; `cargo update -p zero-core` moves it, and
# Zray-Core/tools/link-local.sh builds against a local checkout instead.
[workspace.dependencies]
zero-config = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-core = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-discovery = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-evasion = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-provision = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-runtime = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-scanner = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-security = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-transport = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }
zero-tun = { git = "https://github.com/ZeroNetTeam/Zray-Core", version = "0.1.0", branch = "main" }

anyhow = "1"
base64 = "0.22"
futures = "0.3"
libc = "0.2"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "aws-lc-rs", "std", "tls12", "logging", "zlib"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "aws-lc-rs", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
webpki-roots = "1"

# Optimised for size: on the SOCKS/TLS path the time goes into the crypto
# (hand-written assembly in ring/aws-lc) and the kernel, and the benchmark in
# Zray-Core's docs/benchmarks measures the same speed as -O3 within noise, at about a third
# less file size. The user-space packet stack keeps -O3 below, since TUN mode
# spends its time there.
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = "s"

[profile.release.package.smoltcp]
opt-level = 3
[profile.release.package.netstack-smoltcp]
opt-level = 3
[profile.release.package.zero-tun]
opt-level = 3

# Cargo ignores a dependency's own [patch], so it is repeated here. The core
# needs the vendored rustls (ClientHello shaping) and the netstack fix, both of
# which live in the Zray-Core repository under vendor/.
[patch.crates-io]
rustls = { git = "https://github.com/ZeroNetTeam/Zray-Core", branch = "main" }
netstack-smoltcp = { git = "https://github.com/ZeroNetTeam/Zray-Core", branch = "main" }
